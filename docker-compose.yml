services:
  db:
    image: postgres:16
    container_name: order-manager-db
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
